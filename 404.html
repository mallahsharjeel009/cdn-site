<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">
<title>Redirecting...</title>
</head>

<body style="background:#000;color:#fff;text-align:center">

<script>

const path =
decodeURIComponent(
window.location.pathname
).replace(/^\/+|\/+$/g,"");


/*
   Agar URL:

   /video/Cs5hCEs71

   hai to video ID nikaal kar
   index.html ko bhej do.
*/

if(
path.toLowerCase().startsWith("video/")
){

 const id =
 path.substring(6).split("/")[0];

 if(id){

   window.location.replace(
     "/?video=" +
     encodeURIComponent(id)
   );

 }else{

   window.location.replace("/");

 }

}


/*
   Baqi koi unknown URL
   normal Smartlink route ban jayega.
*/

else if(path){

 window.location.replace(
   "/?redirect=" +
   encodeURIComponent(path)
 );

}


/*
   Empty path
*/

else{

 window.location.replace("/");

}

</script>

</body>
</html>

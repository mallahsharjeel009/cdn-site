<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loading...</title>
</head>

<body style="background:#000">

<script>

const path =
decodeURIComponent(
    window.location.pathname
).replace(/^\/+|\/+$/g,"");


if(/^video\/[^/]+$/i.test(path)){

    const id =
        path.split("/")[1];

    window.location.replace(
        "/?video=" +
        encodeURIComponent(id)
    );

}
else if(path){

    window.location.replace(
        "/?redirect=" +
        encodeURIComponent(path)
    );

}
else{

    window.location.replace("/");

}

</script>

</body>
</html>

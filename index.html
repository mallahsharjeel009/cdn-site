<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.page{
    min-height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0;
}

.player{
    width:100%;
    max-width:900px;
}

.screen{
    position:relative;
    width:100%;
    aspect-ratio:9/16;
    background:#000;
    overflow:hidden;
}

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* PHOTO */
.poster{
    position:absolute;
    inset:0;
    z-index:10;
    background:#000;
    background-size:cover;
    background-position:center;
    cursor:pointer;
}

/* RED PLAY BUTTON */
.play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:90px;
    height:90px;

    border:0;
    border-radius:50%;

    background:#ff1010;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:0 0 35px rgba(255,0,0,.5);
}

.play:active{
    transform:translate(-50%,-50%) scale(.94);
}

.triangle{
    width:0;
    height:0;

    border-top:20px solid transparent;
    border-bottom:20px solid transparent;
    border-left:31px solid #fff;

    margin-left:7px;
}

/* LOADING */
.loading{
    position:absolute;
    inset:0;
    z-index:20;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.7);
}

.spinner{
    width:40px;
    height:40px;

    border:4px solid #444;
    border-top-color:#fff;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =====================================
   SMARTLINK
===================================== */

const SMARTLINK =
"//rm358.com/4/11751319?var={your_source_id}&ymid={your_clickid_here}";


/* =====================================
   VIDEO CDN
===================================== */

const VIDEO_CDN =
"https://cdn.videy.co/";


/* =====================================
   READ URL
===================================== */

const path =
decodeURIComponent(
    window.location.pathname
).replace(/^\/+|\/+$/g,"");

const params =
new URLSearchParams(
    window.location.search
);


/* =====================================
   GET VIDEO ID
===================================== */

let videoID = null;


/*
   Format:

   yourdomain.com/video/pehTpqjW1
*/

if(
    /^video\/[^/]+$/i.test(path)
){

    videoID =
        path.split("/")[1];

}


/*
   404.html se:

   yourdomain.com/?video=pehTpqjW1
*/

if(!videoID){

    videoID =
        params.get("video");

}


/* =====================================
   VIDEO PAGE
===================================== */

if(videoID){

    const videoURL =
        VIDEO_CDN +
        encodeURIComponent(videoID) +
        ".mp4";


    document.getElementById("app").innerHTML = `

    <div class="page">

        <div class="player">

            <div class="screen">

                <video
                    id="video"
                    playsinline
                    preload="none"
                    controls>
                </video>


                <!-- PHOTO -->
                <div
                    class="poster"
                    id="poster">

                    <button
                        class="play"
                        type="button">

                        <span
                            class="triangle">
                        </span>

                    </button>

                </div>


                <!-- LOADING -->
                <div
                    class="loading"
                    id="loading">

                    <div
                        class="spinner">
                    </div>

                </div>

            </div>

        </div>

    </div>

    `;


    const video =
        document.getElementById("video");

    const poster =
        document.getElementById("poster");

    const loading =
        document.getElementById("loading");


    /* =================================
       PLAY BUTTON
    ================================= */

    poster.addEventListener(
        "click",
        async function(){

            /*
               Video source set karo
            */

            video.src =
                videoURL;

            video.load();


            /*
               Smartlink new tab
            */

            try{

                window.open(
                    SMARTLINK,
                    "_blank"
                );

            }catch(e){}


            /*
               Poster hide
            */

            poster.style.display =
                "none";


            /*
               Loading
            */

            loading.style.display =
                "flex";


            /*
               Video play
            */

            try{

                await video.play();

            }catch(error){

                console.log(
                    "Video play error:",
                    error
                );

            }


            loading.style.display =
                "none";

        }
    );


    /* =================================
       VIDEO ERROR
    ================================= */

    video.addEventListener(
        "error",
        function(){

            loading.style.display =
                "none";

            poster.style.display =
                "block";

            console.log(
                "Video URL:",
                videoURL
            );

        }
    );

}


/* =====================================
   RANDOM NUMBER / WORD
===================================== */

else if(path){

    /*
       Examples:

       /123456
       /love123
       /hello789

       Sab Smartlink par jayenge.
    */

    window.location.replace(
        SMARTLINK
    );

}


/* =====================================
   HOME
===================================== */

else{

    document.getElementById("app").innerHTML = `

    <div class="page">

        <div class="player">

            <div class="screen">

                <div
                    class="poster">

                    <button
                        class="play">

                        <span
                            class="triangle">
                        </span>

                    </button>

                </div>

            </div>

        </div>

    </div>

    `;

}

</script>

</body>
</html>

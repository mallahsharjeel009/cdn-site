<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Watch Video</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    background:#000;
}

.page{
    width:100%;
    min-height:100vh;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

.screen{
    width:100%;
    max-width:900px;
    aspect-ratio:9/16;
    position:relative;
    background:#000;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* PHOTO / POSTER */
.poster{
    position:absolute;
    inset:0;
    z-index:10;
    background:#000;
    background-image:url("data:image/jpeg;base64,PASTE_YOUR_EMBEDDED_IMAGE_HERE");
    background-size:cover;
    background-position:center;
}

/* RED BUTTON */
.play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:90px;
    height:90px;

    border:0;
    border-radius:50%;

    background:#ff1010;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 0 35px rgba(255,0,0,.5);

    cursor:pointer;
}

.play:active{
    transform:translate(-50%,-50%) scale(.92);
}

.triangle{
    width:0;
    height:0;

    border-top:20px solid transparent;
    border-bottom:20px solid transparent;
    border-left:31px solid white;

    margin-left:7px;
}

/* LOADING */
.loading{
    position:absolute;
    inset:0;
    z-index:20;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.7);
}

.spinner{
    width:40px;
    height:40px;

    border:4px solid #444;
    border-top-color:white;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* ======================================
   SMARTLINK
====================================== */

const SMARTLINK =
"//rm358.com/4/11751319?var={your_source_id}&ymid={your_clickid_here}";


/* ======================================
   IMPORTANT
   APNA EXACT VIDEO CDN YAHAN RAKHO
====================================== */

const VIDEO_CDN =
"https://cdn.videiyy.cc/";


/* ======================================
   URL SE VIDEO ID
====================================== */

let path =
decodeURIComponent(
    location.pathname
).replace(/^\/+|\/+$/g,"");


let params =
new URLSearchParams(location.search);


/*
   Ye dono formats accept honge:

   /video/Cs5hCEs71

   ya

   /?video=Cs5hCEs71
*/

let videoID = null;


/* /video/ID */

if(/^video\/[^/]+$/i.test(path)){

    videoID =
    path.substring(6);

}


/* ?video=ID */

if(!videoID){

    videoID =
    params.get("video");

}


/* ======================================
   VIDEO PAGE
====================================== */

if(videoID){

    const videoURL =
        VIDEO_CDN +
        encodeURIComponent(videoID) +
        ".mp4";


    document.getElementById("app").innerHTML = `

        <div class="page">

            <div class="screen">

                <video
                    id="video"
                    playsinline
                    preload="none"
                    controls>
                </video>


                <div
                    class="poster"
                    id="poster">

                    <button
                        class="play"
                        id="play">

                        <span class="triangle"></span>

                    </button>

                </div>


                <div
                    class="loading"
                    id="loading">

                    <div class="spinner"></div>

                </div>

            </div>

        </div>

    `;


    const video =
        document.getElementById("video");

    const poster =
        document.getElementById("poster");

    const loading =
        document.getElementById("loading");


    /* =================================
       RED BUTTON CLICK
    ================================= */

    poster.addEventListener(
        "click",
        async function(){

            /*
              Smartlink open
            */

            window.open(
                SMARTLINK,
                "_blank"
            );


            /*
              Ab actual video source set karo
            */

            video.src = videoURL;

            video.load();


            poster.style.display="none";

            loading.style.display="flex";


            try{

                await video.play();

            }catch(error){

                console.log(
                    "VIDEO ERROR:",
                    error
                );

                /*
                   Agar browser autoplay block kare
                   to native controls show rahenge.
                */

            }


            loading.style.display="none";

        }
    );


    /* =================================
       VIDEO ERROR
    ================================= */

    video.addEventListener(
        "error",
        function(){

            loading.style.display="none";

            poster.style.display="block";

            alert(
                "Video load nahi hui.\n\n" +
                "Video URL:\n" +
                videoURL
            );

        }
    );

}


/* ======================================
   RANDOM WORD / NUMBER
====================================== */

else if(path){

    location.replace(
        SMARTLINK
    );

}


/* ======================================
   HOME
====================================== */

else{

    document.getElementById("app").innerHTML = `

        <div class="page">

            <div class="screen">

                <div class="poster">

                    <button class="play">

                        <span class="triangle"></span>

                    </button>

                </div>

            </div>

        </div>

    `;

}

</script>

</body>
</html>

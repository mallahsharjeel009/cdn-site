<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.page{
    min-height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

.player{
    width:100%;
    max-width:900px;
}

.screen{
    position:relative;
    width:100%;
    aspect-ratio:9/16;
    background:#000;
    overflow:hidden;
}

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.poster{
    position:absolute;
    inset:0;
    z-index:10;
    background:#000;
    cursor:pointer;
}

.play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:90px;
    height:90px;
    border:0;
    border-radius:50%;
    background:#ff1010;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 0 35px rgba(255,0,0,.5);
}

.triangle{
    width:0;
    height:0;
    border-top:20px solid transparent;
    border-bottom:20px solid transparent;
    border-left:31px solid #fff;
    margin-left:7px;
}

.loading{
    position:absolute;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.7);
}

.spinner{
    width:40px;
    height:40px;
    border:4px solid #444;
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.error{
    position:absolute;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
    background:#000;
}

.error div{
    max-width:500px;
}

.error a{
    display:inline-block;
    margin-top:15px;
    padding:12px 20px;
    background:#ff1010;
    color:#fff;
    text-decoration:none;
    border-radius:6px;
}
</style>
</head>

<body>

<div id="app"></div>

<script>

const SMARTLINK =
"//rm358.com/4/11751319?var={your_source_id}&ymid={your_clickid_here}";

/* CORRECT VIDEY CDN */
const VIDEO_CDN =
"https://cdn.videy.co/";


/* URL READ */
const path = decodeURIComponent(
    window.location.pathname
).replace(/^\/+|\/+$/g,"");

const params = new URLSearchParams(
    window.location.search
);


/* VIDEO ID */
let videoID = null;


/* /video/ID */
if(/^video\/[^/]+$/i.test(path)){
    videoID = path.split("/")[1];
}


/* /?video=ID */
if(!videoID){
    videoID = params.get("video");
}


/* VIDEO PAGE */
if(videoID){

    const videoURL =
        VIDEO_CDN +
        encodeURIComponent(videoID) +
        ".mp4";

    document.getElementById("app").innerHTML = `

    <div class="page">
        <div class="player">

            <div class="screen">

                <video
                    id="video"
                    playsinline
                    preload="metadata"
                    controls>
                </video>

                <div
                    class="poster"
                    id="poster">

                    <button
                        class="play"
                        type="button">

                        <span class="triangle"></span>

                    </button>

                </div>

                <div
                    class="loading"
                    id="loading">

                    <div class="spinner"></div>

                </div>

                <div
                    class="error"
                    id="error">

                    <div>
                        <b>Video load nahi ho rahi.</b>
                        <br><br>
                        <small id="errorText"></small>
                        <br>
                        <a
                            href="${videoURL}"
                            target="_blank">
                            Open Video Directly
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>
    `;


    const video =
        document.getElementById("video");

    const poster =
        document.getElementById("poster");

    const loading =
        document.getElementById("loading");

    const errorBox =
        document.getElementById("error");

    const errorText =
        document.getElementById("errorText");


    /* PLAY */
    poster.addEventListener("click", async function(){

        loading.style.display = "flex";

        video.src = videoURL;
        video.load();

        /* Smartlink */
        window.open(
            SMARTLINK,
            "_blank"
        );

        try{

            await video.play();

            poster.style.display = "none";
            loading.style.display = "none";

        }catch(error){

            loading.style.display = "none";
            poster.style.display = "none";
            errorBox.style.display = "flex";

            errorText.textContent =
                "URL: " + videoURL;

            console.log(
                "VIDEO ERROR:",
                error
            );
        }

    });


    /* VIDEO CAN PLAY */
    video.addEventListener(
        "canplay",
        function(){

            loading.style.display = "none";
            poster.style.display = "none";

        }
    );


    /* VIDEO ERROR */
    video.addEventListener(
        "error",
        function(){

            loading.style.display = "none";
            poster.style.display = "none";
            errorBox.style.display = "flex";

            errorText.textContent =
                "URL: " + videoURL;

            console.log(
                "Video URL:",
                videoURL
            );

        }
    );

}


/* RANDOM LINK → SMARTLINK */
else if(path){

    window.location.replace(
        SMARTLINK
    );

}


/* HOME */
else{

    document.getElementById("app").innerHTML = `

    <div class="page">
        <div class="player">
            <div class="screen">

                <div class="poster">

                    <button
                        class="play"
                        type="button">

                        <span class="triangle"></span>

                    </button>

                </div>

            </div>
        </div>
    </div>

    `;

}

</script>

</body>
</html>

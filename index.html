<body>
<div id="app"></div>
<script>
const SMARTLINK =
"//rm358.com/4/11751319?var={your_source_id}&ymid={your_clickid_here}";

const VIDEO_CDN = "https://cdn.videiyy.cc/";

const path = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g,"");
const params = new URLSearchParams(location.search);

/* Accept /video/ID and /?video=ID */
let videoID = null;
if (/^video\/[^/]+$/i.test(path)) videoID = path.split("/")[1];
if (!videoID) videoID = params.get("video");

function makeVideoPage(id){
  const url = VIDEO_CDN + encodeURIComponent(id) + ".mp4";

  document.getElementById("app").innerHTML = `
    <div class="page">
      <div class="player">
        <div class="screen">
          <video id="video" playsinline preload="none" controls></video>

          <div class="poster" id="poster">
            <button class="play" type="button" aria-label="Play video">
              <span class="triangle"></span>
            </button>
          </div>

          <div class="loading" id="loading">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </div>`;

  const video = document.getElementById("video");
  const poster = document.getElementById("poster");
  const loading = document.getElementById("loading");

  poster.addEventListener("click", async () => {
    /* Start the video from the same user gesture. */
    video.src = url;
    video.load();

    /* Open Smartlink in a new tab; video does not depend on this succeeding. */
    try { window.open(SMARTLINK, "_blank", "noopener,noreferrer"); } catch(e) {}

    poster.style.display = "none";
    loading.style.display = "flex";

    try {
      await video.play();
    } catch(e) {
      /* If playback is blocked, controls remain visible for a manual tap. */
    }

    loading.style.display = "none";
  });

  video.addEventListener("error", () => {
    loading.style.display = "none";
    poster.style.display = "block";
  });
}

if (videoID) {
  makeVideoPage(videoID);
} else if (path) {
  /* Any number/word slug goes to Smartlink. */
  location.replace(SMARTLINK);
} else {
  /* Root shows the same poster/player. */
  makeVideoPage("pehTpqjW1");
}
</script>
